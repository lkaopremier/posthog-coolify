# PostHog Hobby — adapté pour Coolify
#
# Prérequis : exécuter ./setup.sh une fois avant le premier déploiement
# (ou configurer "bash setup.sh" comme Pre-deploy Command dans Coolify).
#
# Architecture :
#   Internet → Traefik (Coolify, SSL/TLS) → proxy:80 (Caddy, routage HTTP interne) → services
#
# Variables d'environnement requises (à définir dans Coolify ou dans un fichier .env) :
#   DOMAIN              : domaine public (ex: posthog.exemple.com)
#   POSTHOG_SECRET      : clé secrète Django (openssl rand -hex 28)
#   ENCRYPTION_SALT_KEYS: clé de chiffrement (openssl rand -hex 16)
#   POSTHOG_APP_TAG     : tag de l'image PostHog (défaut: latest)

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:

  # ─── Bases de données et messagerie ───────────────────────────────────────

  db:
    image: postgres:15.12-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: posthog
      POSTGRES_DB: posthog
      POSTGRES_PASSWORD: posthog
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posthog"]
      interval: 5s
      timeout: 30s
      retries: 30
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./posthog/docker/postgres-init-scripts:/docker-entrypoint-initdb.d
    logging: *default-logging

  redis7:
    image: redis:7.2-alpine
    restart: on-failure
    command: redis-server --maxmemory-policy allkeys-lru --maxmemory 200mb
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10
    volumes:
      - redis7-data:/data
    logging: *default-logging

  zookeeper:
    image: zookeeper:3.7.0
    restart: on-failure
    volumes:
      - zookeeper-datalog:/datalog
      - zookeeper-data:/data
      - zookeeper-logs:/logs
    logging: *default-logging

  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.9
    restart: on-failure
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://kafka:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://kafka:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr kafka:33145
      - --advertise-rpc-addr kafka:33145
      - --mode dev-container
      - --smp 2
      - --memory 3G
      - --reserve-memory 500M
      - --overprovisioned
      - --set redpanda.empty_seed_starts_cluster=false
      - --seeds kafka:33145
      - --set redpanda.auto_create_topics_enabled=true
    environment:
      ALLOW_PLAINTEXT_LISTENER: "true"
    healthcheck:
      test: curl -f http://localhost:9644/v1/status/ready || exit 1
      interval: 3s
      timeout: 10s
      retries: 10
    volumes:
      - kafka-data:/var/lib/redpanda/data
    logging: *default-logging

  kafka-init:
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.9
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -x
        TIMEOUT=60; ELAPSED=0
        until rpk topic list --brokers kafka:9092 2>/dev/null; do
          sleep 2; ELAPSED=$$((ELAPSED+2))
          [ $$ELAPSED -ge $$TIMEOUT ] && exit 1
        done
        rpk topic create clickhouse_events_json --brokers kafka:9092 -p 1 -r 1 2>&1 || true
        echo "Topics ready"
    depends_on:
      kafka:
        condition: service_healthy
    logging: *default-logging

  clickhouse:
    image: ${CLICKHOUSE_SERVER_IMAGE:-clickhouse/clickhouse-server:26.3.9.8}
    restart: on-failure
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: 1
      KAFKA_HOSTS: "kafka:9092"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 3s
      timeout: 10s
      retries: 10
    entrypoint:
      - bash
      - -c
      - |
        set -e
        BASE="https://raw.githubusercontent.com/PostHog/posthog/master/docker/clickhouse"
        wget -qO /etc/clickhouse-server/config.xml "$$BASE/config.xml"
        mkdir -p /etc/clickhouse-server/config.d
        wget -qO /etc/clickhouse-server/config.d/default.xml "$$BASE/config.d/default.xml"
        wget -qO /etc/clickhouse-server/users.xml "$$BASE/users.xml"
        wget -qO /etc/clickhouse-server/user_defined_function.xml "$$BASE/user_defined_function.xml"
        exec /entrypoint.sh
    depends_on:
      kafka:
        condition: service_started
      zookeeper:
        condition: service_started
    volumes:
      - ./posthog/posthog/idl:/idl
      - ./posthog/docker/clickhouse/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
      - ./posthog/posthog/user_scripts:/var/lib/clickhouse/user_scripts
      - clickhouse-data:/var/lib/clickhouse
    logging: *default-logging

  # ─── Stockage objet ───────────────────────────────────────────────────────

  objectstorage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: on-failure
    environment:
      MINIO_ROOT_USER: object_storage_root_user
      MINIO_ROOT_PASSWORD: object_storage_root_password
    entrypoint: sh
    command: -c 'mkdir -p /data/posthog /data/ducklake-dev /data/ai-blobs && minio server --address ":19000" --console-address ":19001" /data'
    volumes:
      - objectstorage:/data
    logging: *default-logging

  # ─── Services Rust (capture, feature-flags, personhog…) ──────────────────

  capture:
    image: ghcr.io/posthog/posthog/capture:master
    restart: on-failure
    environment:
      ADDRESS: "0.0.0.0:3000"
      KAFKA_TOPIC: "events_plugin_ingestion"
      KAFKA_HOSTS: "kafka:9092"
      REDIS_URL: "redis://redis7:6379/"
      CAPTURE_MODE: events
      RUST_LOG: "info,rdkafka=warn"
    depends_on:
      - kafka
      - redis7
    logging: *default-logging

  replay-capture:
    image: ghcr.io/posthog/posthog/capture:master
    restart: on-failure
    environment:
      ADDRESS: "0.0.0.0:3000"
      KAFKA_TOPIC: "session_recording_snapshot_item_events"
      KAFKA_HOSTS: "kafka:9092"
      REDIS_URL: "redis://redis7:6379/"
      CAPTURE_MODE: recordings
    depends_on:
      - kafka
      - redis7
    logging: *default-logging

  capture-ai:
    image: ghcr.io/posthog/posthog/capture:master
    restart: on-failure
    environment:
      ADDRESS: "0.0.0.0:3000"
      KAFKA_TOPIC: "events_plugin_ingestion"
      KAFKA_HOSTS: "kafka:9092"
      REDIS_URL: "redis://redis7:6379/"
      CAPTURE_MODE: events
      RUST_LOG: "info,rdkafka=warn"
      AI_S3_BUCKET: ai-blobs
      AI_S3_PREFIX: "llma/"
      AI_S3_ENDPOINT: "http://objectstorage:19000"
      AI_S3_REGION: us-east-1
      AI_S3_ACCESS_KEY_ID: object_storage_root_user
      AI_S3_SECRET_ACCESS_KEY: object_storage_root_password
    depends_on:
      - kafka
      - redis7
      - objectstorage
    logging: *default-logging

  feature-flags:
    image: ghcr.io/posthog/posthog/feature-flags:master
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/_readiness"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    environment:
      WRITE_DATABASE_URL: "postgres://posthog:posthog@db:5432/posthog"
      READ_DATABASE_URL: "postgres://posthog:posthog@db:5432/posthog"
      PERSONS_WRITE_DATABASE_URL: "postgres://posthog:posthog@db:5432/posthog"
      PERSONS_READ_DATABASE_URL: "postgres://posthog:posthog@db:5432/posthog"
      REDIS_URL: "redis://redis7:6379/"
      ADDRESS: "0.0.0.0:3001"
      RUST_LOG: "info"
      COOKIELESS_REDIS_HOST: redis7
      COOKIELESS_REDIS_PORT: 6379
    depends_on:
      - db
      - redis7
    logging: *default-logging

  hypercache-server:
    image: ghcr.io/posthog/posthog/hypercache-server:master
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/_readiness"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    environment:
      REDIS_URL: "redis://redis7:6379/"
      ADDRESS: "0.0.0.0:3002"
      RUST_LOG: "info"
    depends_on:
      - redis7
    logging: *default-logging

  personhog-replica:
    image: ghcr.io/posthog/posthog/personhog-replica:master
    restart: on-failure
    environment:
      GRPC_ADDRESS: "0.0.0.0:50051"
      PRIMARY_DATABASE_URL: "postgres://posthog:posthog@db:5432/posthog"
      RUST_LOG: "info"
      METRICS_PORT: "9100"
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging

  personhog-router:
    image: ghcr.io/posthog/posthog/personhog-router:master
    restart: on-failure
    environment:
      GRPC_ADDRESS: "0.0.0.0:50052"
      REPLICA_URL: "http://personhog-replica:50051"
      BACKEND_TIMEOUT_MS: "5000"
      RUST_LOG: "info"
      METRICS_PORT: "9101"
    depends_on:
      - personhog-replica
    logging: *default-logging

  cymbal:
    image: ghcr.io/posthog/posthog/cymbal:master
    restart: on-failure
    environment:
      KAFKA_HOSTS: "kafka:9092"
      OBJECT_STORAGE_BUCKET: posthog
      OBJECT_STORAGE_ACCESS_KEY_ID: "object_storage_root_user"
      OBJECT_STORAGE_SECRET_ACCESS_KEY: "object_storage_root_password"
      OBJECT_STORAGE_ENDPOINT: "http://objectstorage:19000"
      OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
      BIND_HOST: "0.0.0.0"
      BIND_PORT: "3302"
      DATABASE_URL: "postgres://posthog:posthog@db:5432/posthog"
      PERSONS_URL: "postgres://posthog:posthog@db:5432/posthog"
      REDIS_URL: "redis://redis7:6379/"
      ISSUE_BUCKETS_REDIS_URL: "redis://redis7:6379/"
      RUST_LOG: "info"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      objectstorage:
        condition: service_started
      db:
        condition: service_healthy
      redis7:
        condition: service_healthy
    logging: *default-logging

  # ─── Services Node.js (plugins, ingestion…) ───────────────────────────────

  plugins:
    image: ${REGISTRY_URL:-posthog/posthog}-node:${POSTHOG_NODE_TAG:-latest}
    command: node nodejs/dist/index.js
    restart: on-failure
    environment:
      DATABASE_URL: "postgres://posthog:posthog@db:5432/posthog"
      PERSONS_DATABASE_URL: "postgres://posthog:posthog@db:5432/posthog"
      BEHAVIORAL_COHORTS_DATABASE_URL: "postgres://posthog:posthog@db:5432/posthog"
      KAFKA_HOSTS: "kafka:9092"
      REDIS_URL: "redis://redis7:6379/"
      CLICKHOUSE_HOST: "clickhouse"
      CLICKHOUSE_DATABASE: "posthog"
      CLICKHOUSE_SECURE: "false"
      CLICKHOUSE_VERIFY: "false"
      SITE_URL: "https://${DOMAIN}"
      SECRET_KEY: "${POSTHOG_SECRET}"
      OBJECT_STORAGE_ACCESS_KEY_ID: "object_storage_root_user"
      OBJECT_STORAGE_SECRET_ACCESS_KEY: "object_storage_root_password"
      OBJECT_STORAGE_ENDPOINT: "http://objectstorage:19000"
      OBJECT_STORAGE_ENABLED: "true"
      CDP_REDIS_HOST: redis7
      CDP_REDIS_PORT: 6379
      ENCRYPTION_SALT_KEYS: "${ENCRYPTION_SALT_KEYS}"
      CYCLOTRON_DATABASE_URL: "postgres://posthog:posthog@db:5432/posthog"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    depends_on:
      - db
      - redis7
      - clickhouse
      - kafka
      - objectstorage
    logging: *default-logging

  ingestion-general:
    image: ${REGISTRY_URL:-posthog/posthog}-node:${POSTHOG_NODE_TAG:-latest}
    command: node nodejs/dist/index.js
    restart: on-failure
    environment:
      PLUGIN_SERVER_MODE: "ingestion-v2-combined"
      DATABASE_URL: "postgres://posthog:posthog@db:5432/posthog"
      PERSONS_DATABASE_URL: "postgres://posthog:posthog@db:5432/posthog"
      BEHAVIORAL_COHORTS_DATABASE_URL: "postgres://posthog:posthog@db:5432/posthog"
      KAFKA_HOSTS: "kafka:9092"
      REDIS_URL: "redis://redis7:6379/"
      CLICKHOUSE_HOST: "clickhouse"
      CLICKHOUSE_DATABASE: "posthog"
      CLICKHOUSE_SECURE: "false"
      CLICKHOUSE_VERIFY: "false"
      COOKIELESS_REDIS_HOST: redis7
      COOKIELESS_REDIS_PORT: 6379
      CDP_REDIS_HOST: redis7
      ENCRYPTION_SALT_KEYS: "${ENCRYPTION_SALT_KEYS}"
    depends_on:
      - db
      - redis7
      - clickhouse
      - kafka
    logging: *default-logging

  ingestion-sessionreplay:
    image: ${REGISTRY_URL:-posthog/posthog}-node:${POSTHOG_NODE_TAG:-latest}
    command: node nodejs/dist/index.js
    restart: on-failure
    environment:
      PLUGIN_SERVER_MODE: "recordings-blob-ingestion-v2"
      DATABASE_URL: "postgres://posthog:posthog@db:5432/posthog"
      KAFKA_HOSTS: "kafka:9092"
      REDIS_URL: "redis://redis7:6379/"
      SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: "object_storage_root_user"
      SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: "object_storage_root_password"
      SESSION_RECORDING_V2_S3_TIMEOUT_MS: 120000
      SESSION_RECORDING_V2_S3_ENDPOINT: "http://objectstorage:19000"
      ENCRYPTION_SALT_KEYS: "${ENCRYPTION_SALT_KEYS}"
    depends_on:
      - db
      - redis7
      - kafka
      - objectstorage
    logging: *default-logging

  recording-api:
    image: ${REGISTRY_URL:-posthog/posthog}-node:${POSTHOG_NODE_TAG:-latest}
    command: node nodejs/dist/index.js
    restart: on-failure
    environment:
      PLUGIN_SERVER_MODE: "recording-api"
      DATABASE_URL: "postgres://posthog:posthog@db:5432/posthog"
      REDIS_URL: "redis://redis7:6379/"
      CLICKHOUSE_HOST: "clickhouse"
      CLICKHOUSE_DATABASE: "posthog"
      CLICKHOUSE_SECURE: "false"
      CLICKHOUSE_VERIFY: "false"
      SESSION_RECORDING_API_REDIS_HOST: redis7
      SESSION_RECORDING_API_REDIS_PORT: 6379
      ENCRYPTION_SALT_KEYS: "${ENCRYPTION_SALT_KEYS}"
    depends_on:
      - db
      - redis7
      - clickhouse
    logging: *default-logging

  ingestion-error-tracking:
    image: ${REGISTRY_URL:-posthog/posthog}-node:${POSTHOG_NODE_TAG:-latest}
    command: node nodejs/dist/index.js
    restart: on-failure
    environment:
      PLUGIN_SERVER_MODE: "ingestion-errortracking"
      DATABASE_URL: "postgres://posthog:posthog@db:5432/posthog"
      PERSONS_DATABASE_URL: "postgres://posthog:posthog@db:5432/posthog"
      KAFKA_HOSTS: "kafka:9092"
      REDIS_URL: "redis://redis7:6379/"
      CDP_REDIS_HOST: redis7
      ENCRYPTION_SALT_KEYS: "${ENCRYPTION_SALT_KEYS}"
    depends_on:
      - db
      - redis7
      - kafka
    logging: *default-logging

  ingestion-logs:
    image: ${REGISTRY_URL:-posthog/posthog}-node:${POSTHOG_NODE_TAG:-latest}
    command: node nodejs/dist/index.js
    restart: on-failure
    environment:
      PLUGIN_SERVER_MODE: "ingestion-logs"
      DATABASE_URL: "postgres://posthog:posthog@db:5432/posthog"
      KAFKA_HOSTS: "kafka:9092"
      REDIS_URL: "redis://redis7:6379/"
      LOGS_REDIS_HOST: redis7
    depends_on:
      - db
      - redis7
      - kafka
    logging: *default-logging

  ingestion-traces:
    image: ${REGISTRY_URL:-posthog/posthog}-node:${POSTHOG_NODE_TAG:-latest}
    command: node nodejs/dist/index.js
    restart: on-failure
    environment:
      PLUGIN_SERVER_MODE: "ingestion-traces"
      DATABASE_URL: "postgres://posthog:posthog@db:5432/posthog"
      KAFKA_HOSTS: "kafka:9092"
      REDIS_URL: "redis://redis7:6379/"
      TRACES_REDIS_HOST: redis7
    depends_on:
      - db
      - redis7
      - kafka
    logging: *default-logging

  # ─── Services Python (web, worker) ────────────────────────────────────────

  web:
    image: ${REGISTRY_URL:-posthog/posthog}:${POSTHOG_APP_TAG:-latest}
    command: ./bin/start-backend & ./bin/start-frontend
    restart: on-failure
    environment:
      DATABASE_URL: "postgres://posthog:posthog@db:5432/posthog"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_DATABASE: posthog
      CLICKHOUSE_SECURE: "false"
      CLICKHOUSE_VERIFY: "false"
      REDIS_URL: "redis://redis7:6379/"
      KAFKA_HOSTS: "kafka:9092"
      IS_BEHIND_PROXY: "true"
      DISABLE_SECURE_SSL_REDIRECT: "true"
      SITE_URL: "https://${DOMAIN}"
      LIVESTREAM_HOST: "https://${DOMAIN}/livestream"
      SECRET_KEY: "${POSTHOG_SECRET}"
      DEPLOYMENT: hobby
      OBJECT_STORAGE_ACCESS_KEY_ID: "object_storage_root_user"
      OBJECT_STORAGE_SECRET_ACCESS_KEY: "object_storage_root_password"
      OBJECT_STORAGE_ENDPOINT: "http://objectstorage:19000"
      OBJECT_STORAGE_PUBLIC_ENDPOINT: "https://${DOMAIN}"
      SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: "object_storage_root_user"
      SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: "object_storage_root_password"
      OBJECT_STORAGE_ENABLED: "true"
      SESSION_RECORDING_V2_S3_ENDPOINT: "http://objectstorage:19000"
      RECORDING_API_URL: "http://recording-api:6738"
      ENCRYPTION_SALT_KEYS: "${ENCRYPTION_SALT_KEYS}"
      CDP_API_URL: "http://plugins:6738"
      FLAGS_REDIS_ENABLED: "false"
      OTEL_SDK_DISABLED: "true"
      OPT_OUT_CAPTURE: "${OPT_OUT_CAPTURE:-false}"
      PERSONHOG_ADDR: "http://personhog-router:50052"
      PERSONHOG_ENABLED: "true"
      PERSONHOG_ROLLOUT_PERCENTAGE: "100"
      POSTHOG_SKIP_MIGRATION_CHECKS: "1"
    depends_on:
      - db
      - redis7
      - clickhouse
      - kafka
      - objectstorage
      - personhog-router
    logging: *default-logging

  worker:
    image: ${REGISTRY_URL:-posthog/posthog}:${POSTHOG_APP_TAG:-latest}
    command: ./bin/docker-worker-celery --with-scheduler
    restart: on-failure
    environment:
      DATABASE_URL: "postgres://posthog:posthog@db:5432/posthog"
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_DATABASE: posthog
      CLICKHOUSE_SECURE: "false"
      CLICKHOUSE_VERIFY: "false"
      REDIS_URL: "redis://redis7:6379/"
      KAFKA_HOSTS: "kafka:9092"
      IS_BEHIND_PROXY: "true"
      DISABLE_SECURE_SSL_REDIRECT: "true"
      SITE_URL: "https://${DOMAIN}"
      SECRET_KEY: "${POSTHOG_SECRET}"
      DEPLOYMENT: hobby
      OBJECT_STORAGE_ACCESS_KEY_ID: "object_storage_root_user"
      OBJECT_STORAGE_SECRET_ACCESS_KEY: "object_storage_root_password"
      OBJECT_STORAGE_ENDPOINT: "http://objectstorage:19000"
      OBJECT_STORAGE_PUBLIC_ENDPOINT: "https://${DOMAIN}"
      SESSION_RECORDING_V2_S3_ENDPOINT: "http://objectstorage:19000"
      SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: "object_storage_root_user"
      SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: "object_storage_root_password"
      OBJECT_STORAGE_ENABLED: "true"
      RECORDING_API_URL: "http://recording-api:6738"
      ENCRYPTION_SALT_KEYS: "${ENCRYPTION_SALT_KEYS}"
      CDP_API_URL: "http://plugins:6738"
      FLAGS_REDIS_ENABLED: "false"
      OTEL_SDK_DISABLED: "true"
      POSTHOG_SKIP_MIGRATION_CHECKS: "1"
      PERSONHOG_ADDR: "http://personhog-router:50052"
      PERSONHOG_ENABLED: "true"
      PERSONHOG_ROLLOUT_PERCENTAGE: "100"
    depends_on:
      db:
        condition: service_healthy
      redis7:
        condition: service_healthy
      clickhouse:
        condition: service_started
      kafka:
        condition: service_healthy
      web:
        condition: service_started
      personhog-router:
        condition: service_started
    logging: *default-logging

  livestream:
    image: "ghcr.io/posthog/posthog/livestream:master"
    restart: on-failure
    environment:
      LIVESTREAM_JWT_SECRET: "${POSTHOG_SECRET}"
    volumes:
      - ./configs/livestream/configs-hobby.yml:/configs/configs.yml
    depends_on:
      kafka:
        condition: service_started
    logging: *default-logging

  # ─── Proxy interne (Caddy) ─────────────────────────────────────────────────
  # Coolify (Traefik) gère le SSL en amont — Caddy route en HTTP pur ici.
  # Dans Coolify : exposer le service "proxy" sur le port 80.
  proxy:
    image: caddy:2
    restart: always
    entrypoint: sh
    command: -c 'echo "$$CADDYFILE" > /etc/caddy/Caddyfile && exec caddy run -c /etc/caddy/Caddyfile'
    environment:
      CADDYFILE: |
        {
          admin off
        }
        http://0.0.0.0:80 {
          @replay-capture  { path /s /s/ /s/* }
          @capture-ai      { path /i/v0/ai /i/v0/ai/ /i/v0/ai/* }
          @capture         { path /e /e/ /e/* /i/v0 /i/v0/ /i/v0/* /batch /batch/ /batch/* /capture /capture/ /capture/* }
          @flags           { path /flags /flags/ /flags/* }
          @surveys         { path /surveys /surveys/ /api/surveys /api/surveys/ }
          @remote-config   { path /array/* }
          @webhooks        { path /public/webhooks /public/webhooks/* /public/m/ /public/m/* }
          @livestream      { path /livestream /livestream/ /livestream/* }
          @objectstorage   { path /posthog /posthog/ /posthog/* }

          handle @livestream     { uri strip_prefix /livestream; reverse_proxy livestream:8080 { flush_interval -1 } }
          handle @capture-ai     { reverse_proxy capture-ai:3000 }
          handle @capture        { reverse_proxy capture:3000 }
          handle @replay-capture { reverse_proxy replay-capture:3000 }
          handle @flags          { reverse_proxy feature-flags:3001 }
          handle @surveys        { reverse_proxy hypercache-server:3002 }
          handle @remote-config  { reverse_proxy hypercache-server:3002 }
          handle @webhooks       { reverse_proxy plugins:6738 }
          handle @objectstorage  { reverse_proxy objectstorage:19000 }
          handle                 { reverse_proxy web:8000 }
        }
    depends_on:
      - web
      - livestream
    logging: *default-logging

volumes:
  postgres-data:
  redis7-data:
  clickhouse-data:
  kafka-data:
  objectstorage:
  zookeeper-data:
  zookeeper-datalog:
  zookeeper-logs:
